; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_TINYUSB=1

    -DCFG_TUD_AUDIO=1
    -DCFG_TUD_AUDIO_FUNC_1_DESC_LEN=136
    -DCFG_TUD_AUDIO_FUNC_1_N_AS_INT=1
    -DCFG_TUD_AUDIO_FUNC_1_CTRL_BUF_SZ=64
    -DCFG_TUD_AUDIO_ENABLE_EP_OUT=1
    -DCFG_TUD_AUDIO_FUNC_1_EP_OUT_SZ_MAX=512
    -DCFG_TUD_AUDIO_FUNC_1_EP_OUT_SW_BUF_SZ=512

board_build.partitions = huge_app.csv